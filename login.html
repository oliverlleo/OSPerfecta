<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OS Perfecta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .logo-login {
            display: block;
            margin: 0 auto 1.5rem;
            max-height: 60px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center">
            <img src="img/logo.png" alt="Logo" class="logo-login">
            <h3 class="mb-4">Acesso ao Sistema</h3>
        </div>

        <div id="loginError" class="alert alert-danger" style="display: none;"></div>

        <ul class="nav nav-tabs mb-3" id="loginTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-admin" data-bs-toggle="tab" data-bs-target="#content-admin" type="button" role="tab">Funcionário</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-prestador" data-bs-toggle="tab" data-bs-target="#content-prestador" type="button" role="tab">Prestador</button>
            </li>
        </ul>

        <div class="tab-content" id="loginTabContent">
            <!-- Login Admin/Staff -->
            <div class="tab-pane fade show active" id="content-admin" role="tabpanel">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required placeholder="admin@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" required placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btnLogin">Entrar</button>
                </form>
            </div>

            <!-- Login Prestador -->
            <div class="tab-pane fade" id="content-prestador" role="tabpanel">
                <form id="loginFormPrestador">
                    <div class="mb-3">
                        <label for="prestadorLogin" class="form-label">Login</label>
                        <input type="text" class="form-control" id="prestadorLogin" required placeholder="Seu usuário">
                    </div>
                    <div class="mb-3">
                        <label for="prestadorSenha" class="form-label">Senha (4 dígitos)</label>
                        <input type="password" class="form-control" id="prestadorSenha" required maxlength="4" placeholder="****">
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="btnLoginPrestador">Acessar Relatório</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
