<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Prestador - OS Perfecta</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/additional.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Acesso do Prestador</h2>
        <p>Informe suas credenciais para acessar o relatório.</p>
        <form id="formLoginPrestador">
            <div class="form-group">
                <label for="login">Login</label>
                <input type="text" id="login" class="form-control" required placeholder="Seu nome de usuário">
            </div>
            <div class="form-group">
                <label for="senha">Senha (4 dígitos)</label>
                <input type="password" id="senha" class="form-control" required maxlength="4" placeholder="****">
            </div>
            <button type="submit" class="btn-primary" id="btnEntrar">Acessar</button>
            <p id="msgErro" class="error-message">Credenciais inválidas.</p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('formLoginPrestador');
            const loginInput = document.getElementById('login');
            const senhaInput = document.getElementById('senha');
            const btnEntrar = document.getElementById('btnEntrar');
            const msgErro = document.getElementById('msgErro');

            // Obter parâmetros da URL
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug'); // O slug da OS que ele tentou acessar

            if (!slug) {
                // Se não tem slug, não faz sentido estar aqui (fluxo incorreto)
                // Redirecionar para home ou mostrar erro
                document.querySelector('.login-container').innerHTML = '<h3>Erro: Link inválido.</h3><p>Nenhuma OS especificada para acesso.</p>';
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const login = loginInput.value.trim();
                const senha = senhaInput.value.trim();

                if (!login || !senha) return;

                btnEntrar.disabled = true;
                btnEntrar.textContent = 'Verificando...';
                msgErro.style.display = 'none';

                try {
                    // Usar a mesma RPC criada anteriormente
                    const { data, error } = await window.supabaseClient.rpc('validar_credenciais_prestador', {
                        p_login: login,
                        p_senha: senha
                    });

                    if (error) throw error;

                    if (data === true) {
                        // Sucesso! Salvar na sessão e redirecionar
                        sessionStorage.setItem('providerAuth', 'true');
                        // Redirecionar de volta para o relatório com o slug
                        window.location.href = `relatorio.html?slug=${slug}`;
                    } else {
                        throw new Error('Credenciais inválidas');
                    }

                } catch (err) {
                    console.error('Erro login prestador:', err);
                    msgErro.textContent = 'Login ou senha incorretos.';
                    msgErro.style.display = 'block';
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = 'Acessar';
                }
            });
        });
    </script>
</body>
</html>
